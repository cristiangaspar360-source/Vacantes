<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscador de Vacantes</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#101828; --muted:#667085;
    --line:#e3e8ef; --brand:#1d4ed8; --brand-ink:#ffffff; --soft:#eef2ff;
    --ok:#059669; --radius:14px;
    --sh:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1117; --card:#171a21; --ink:#e9edf5; --muted:#98a2b3;
      --line:#272b35; --brand:#3b82f6; --soft:#1b2436;
      --sh:0 1px 2px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:14px;
  }
  .wrap{max-width:960px;margin:0 auto}

  header{margin-bottom:12px}
  h1{font-size:19px;margin:0 0 2px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px;margin:0}

  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--sh);padding:14px;margin-bottom:12px;
  }

  .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:620px){ .fields{grid-template-columns:1fr} }

  label{display:block;font-size:12px;font-weight:600;color:var(--muted);
        text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
  .inputRow{position:relative;display:flex}
  input[type=text]{
    width:100%;padding:11px 34px 11px 12px;font-size:16px;
    border:1px solid var(--line);border-radius:10px;
    background:var(--bg);color:var(--ink);outline:none;
  }
  input[type=text]:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
  .clr{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    border:0;background:transparent;color:var(--muted);font-size:18px;
    cursor:pointer;padding:2px 6px;line-height:1;border-radius:6px;
  }
  .clr:hover{background:var(--soft);color:var(--ink)}

  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .chip{
    border:1px solid var(--line);background:transparent;color:var(--muted);
    font-size:12px;padding:4px 9px;border-radius:999px;cursor:pointer;
    font-family:inherit;white-space:nowrap;
  }
  .chip:hover{background:var(--soft);color:var(--ink);border-color:var(--brand)}
  .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
  .btn{
    font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
    border-radius:10px;padding:10px 14px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);
  }
  .btn:hover{border-color:var(--brand)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent;color:var(--muted)}
  .hint{font-size:12px;color:var(--muted);margin-left:auto}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:9px}
  .site{
    display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);
    border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:var(--card);
    transition:border-color .12s, transform .12s;
  }
  .site:hover{border-color:var(--brand);transform:translateY(-1px)}
  .site .dot{width:26px;height:26px;flex:none;border-radius:7px;display:grid;place-items:center;
             font-size:12px;font-weight:800;color:#fff}
  .site .nm{font-weight:600;font-size:14px;line-height:1.15}
  .site .tg{font-size:11px;color:var(--muted)}
  .site .cp{
    margin-left:auto;border:0;background:transparent;color:var(--muted);
    cursor:pointer;font-size:14px;padding:4px 5px;border-radius:6px;
  }
  .site .cp:hover{background:var(--soft);color:var(--ink)}

  details.track{margin-top:0}
  details.track summary{
    cursor:pointer;font-weight:600;font-size:14px;list-style:none;
    display:flex;align-items:center;gap:8px;
  }
  details.track summary::-webkit-details-marker{display:none}
  details.track summary::before{content:"▸";color:var(--muted);transition:transform .15s}
  details.track[open] summary::before{transform:rotate(90deg)}
  .count{background:var(--soft);color:var(--brand);border-radius:999px;
         font-size:11px;font-weight:700;padding:2px 8px}

  .tblWrap{overflow-x:auto;margin-top:12px}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:880px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
     color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  td input,td select{
    width:100%;border:1px solid transparent;background:transparent;color:var(--ink);
    font:inherit;font-size:13px;padding:5px 6px;border-radius:6px;
  }
  td input:focus,td select:focus{border-color:var(--brand);background:var(--bg);outline:none}
  td select{cursor:pointer}
  .del{border:0;background:transparent;color:var(--muted);cursor:pointer;
       font-size:15px;padding:3px 6px;border-radius:6px}
  .del:hover{background:#fee2e2;color:#b42318}
  .empty{color:var(--muted);font-size:13px;padding:14px 2px}

  .toast{
    position:fixed;left:50%;bottom:16px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;
    padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;
    transition:opacity .18s, transform .18s;z-index:50;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Buscador de vacantes</h1>
    <p class="sub">Elige localidad y/o puesto. Los enlaces se arman solos — un clic y se abre el portal.</p>
  </header>

  <!-- ====== BÚSQUEDA ====== -->
  <section class="panel">
    <div class="fields">
      <div>
        <label for="ciudad">Localidad</label>
        <div class="inputRow">
          <input type="text" id="ciudad" list="dlCiudades" autocomplete="off"
                 placeholder="Ej. Guadalajara Jalisco">
          <button class="clr" id="clrCiudad" title="Limpiar" aria-label="Limpiar localidad">×</button>
        </div>
        <datalist id="dlCiudades"></datalist>
        <div class="chips" id="chipsCiudad"></div>
      </div>

      <div>
        <label for="puesto">Puesto</label>
        <div class="inputRow">
          <input type="text" id="puesto" list="dlPuestos" autocomplete="off"
                 placeholder="Ej. Supervisor de almacen">
          <button class="clr" id="clrPuesto" title="Limpiar" aria-label="Limpiar puesto">×</button>
        </div>
        <datalist id="dlPuestos"></datalist>
        <div class="chips" id="chipsPuesto"></div>
      </div>
    </div>

    <div class="bar">
      <button class="btn primary" id="btnTodos">Abrir todos los portales</button>
      <button class="btn ghost" id="btnCopiar">Copiar links</button>
      <span class="hint" id="resumen"></span>
    </div>
  </section>

  <!-- ====== PORTALES ====== -->
  <section class="panel">
    <div class="grid" id="grid"></div>
  </section>

  <!-- ====== SEGUIMIENTO ====== -->
  <section class="panel">
    <details class="track" id="detTrack">
      <summary>Mis postulaciones <span class="count" id="cnt">0</span></summary>

      <div class="bar" style="margin-top:12px">
        <button class="btn" id="btnAdd">+ Agregar vacante</button>
        <button class="btn ghost" id="btnCsv">Descargar Excel (CSV)</button>
      </div>

      <div class="tblWrap">
        <table>
          <thead>
            <tr>
              <th style="width:118px">Fecha</th>
              <th style="width:150px">Empresa</th>
              <th style="width:160px">Puesto</th>
              <th style="width:140px">Ciudad</th>
              <th style="width:150px">Link</th>
              <th style="width:120px">Estatus</th>
              <th>Notas</th>
              <th style="width:34px"></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <p class="empty" id="vacio">Aún no registras vacantes. Usa “+ Agregar vacante”.</p>
    </details>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   CONFIGURACIÓN — edita solo esta parte para personalizar la herramienta
   ========================================================================= */

const CIUDADES = [
  "Villa Corona Jalisco",
  "Acatlan de Juarez Jalisco",
  "Zacoalco de Torres Jalisco",
  "Tlajomulco de Zuñiga Jalisco",
  "Guadalajara Jalisco",
  "Jalisco"
];

const PUESTOS = [
  "Supervisor de almacen",
  "Supervisor inventarios",
  "Logistica",
  "Supply chain",
  "Analista inventarios",
  "Coordinador logistica"
];

const ESTATUS = ["No aplicado","Aplicado","En proceso","Entrevista","Oferta","Rechazado"];

/* Portales. `url(p, c)` recibe puesto y ciudad (texto libre, puede venir vacío). */
const PORTALES = [
  {
    id:"indeed", nombre:"Indeed", color:"#2557a7", ini:"in",
    url:(p,c)=> `https://mx.indeed.com/jobs?q=${enc(p)}&l=${enc(c)}`
  },
  {
    id:"computrabajo", nombre:"Computrabajo", color:"#00a0dc", ini:"CT",
    url:(p,c)=>{
      // Sin puesto se usa la página de la ciudad, que exige el slug sin el estado.
      if(!p) return `https://mx.computrabajo.com/empleos-en-${slug(sinEstado(c))}`;
      const base = `https://mx.computrabajo.com/trabajo-de-${guion(p)}`;
      return c ? `${base}--en-${guion(c)}` : base;
    }
  },
  {
    id:"occ", nombre:"OCC Mundial", color:"#0a66c2", ini:"OC",
    // OCC ignora el filtro de ciudad en la ruta: se manda todo como palabra clave.
    url:(p,c)=> `https://www.occ.com.mx/empleos/de-${slug([p,c].filter(Boolean).join(" "))}/`
  },
  {
    id:"linkedin", nombre:"LinkedIn", color:"#0077b5", ini:"Li",
    url:(p,c)=> `https://www.linkedin.com/jobs/search/?keywords=${encodeURIComponent(p)}&location=${encodeURIComponent(c)}`
  },
  {
    id:"google", nombre:"Google Empleos", color:"#ea4335", ini:"G",
    url:(p,c)=> `https://www.google.com/search?q=${encodeURIComponent([p,c].filter(Boolean).join(" "))}&ibp=htl;jobs`
  },
  {
    id:"jooble", nombre:"Jooble", color:"#1a73e8", ini:"Jo",
    url:(p,c)=> `https://mx.jooble.org/SearchResult?ukw=${encodeURIComponent(p)}&rgns=${encodeURIComponent(c)}`
  },
  {
    id:"talenteca", nombre:"Talenteca", color:"#7c3aed", ini:"Ta",
    url:(p,c)=> `https://www.talenteca.com/mexico/empleos?q=${enc([p,c].filter(Boolean).join(" "))}`
  }
];

/* =========================================================================
   LÓGICA
   ========================================================================= */

const $ = id => document.getElementById(id);

/* Quita acentos: los portales usan slugs sin diacríticos. */
const RE_DIACRITICOS = new RegExp("[\\u0300-\\u036f]", "g");
const sinAcentos = s => (s||"").normalize("NFD").replace(RE_DIACRITICOS, "");
/* "Supervisor de almacen" -> "Supervisor+de+almacen" (estilo Indeed/Talenteca) */
const enc   = s => sinAcentos(s).trim().replace(/\s+/g,"+");
/* "Supervisor de almacen" -> "Supervisor-de-almacen" (estilo Computrabajo) */
const guion = s => sinAcentos(s).trim().replace(/\s+/g,"-");
/* "Guadalajara Jalisco" -> "guadalajara-jalisco" (estilo OCC) */
const slug  = s => sinAcentos(s).toLowerCase().trim()
                    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");

/* Quita el estado del final: "Guadalajara Jalisco" -> "Guadalajara".
   Computrabajo solo reconoce la página de una ciudad sin el estado. */
const ESTADOS = ["aguascalientes","baja california sur","baja california","campeche","chiapas",
  "chihuahua","ciudad de mexico","coahuila","colima","durango","estado de mexico","guanajuato",
  "guerrero","hidalgo","jalisco","michoacan","morelos","nayarit","nuevo leon","oaxaca","puebla",
  "queretaro","quintana roo","san luis potosi","sinaloa","sonora","tabasco","tamaulipas",
  "tlaxcala","veracruz","yucatan","zacatecas"];
function sinEstado(c){
  const limpio = sinAcentos(c||"").toLowerCase().replace(/,/g," ").replace(/\s+/g," ").trim();
  for(const e of ESTADOS){
    if(limpio.endsWith(" "+e)) return limpio.slice(0, -(e.length+1)).trim();
  }
  return limpio;
}

/* Almacenamiento tolerante: dentro de un iframe de Google Sites el navegador
   puede bloquear localStorage. Si pasa, se usa memoria de la sesión. */
const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return k in mem ? mem[k] : null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
};

let toastT;
function toast(msg){
  const t = $("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.remove("on"), 1900);
}

/* ---------- Sugerencias (datalist + chips de 1 clic) ---------- */
function pintarSugerencias(){
  $("dlCiudades").innerHTML = CIUDADES.map(v=>`<option value="${esc(v)}">`).join("");
  $("dlPuestos").innerHTML  = PUESTOS.map(v=>`<option value="${esc(v)}">`).join("");

  const chips = (cont, valores, input) => {
    cont.innerHTML = valores
      .map(v=>`<button type="button" class="chip" data-v="${esc(v)}">${esc(v)}</button>`).join("");
    cont.addEventListener("click", e=>{
      const b = e.target.closest(".chip");
      if(!b) return;
      // Volver a tocar el chip activo lo desmarca (permite buscar solo por el otro campo).
      input.value = (input.value === b.dataset.v) ? "" : b.dataset.v;
      actualizar();
    });
  };
  chips($("chipsCiudad"), CIUDADES, $("ciudad"));
  chips($("chipsPuesto"), PUESTOS,  $("puesto"));
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Tarjetas de portales ---------- */
function pintarPortales(){
  $("grid").innerHTML = PORTALES.map(p=>`
    <a class="site" id="a-${p.id}" href="#" target="_blank" rel="noopener noreferrer">
      <span class="dot" style="background:${p.color}">${esc(p.ini)}</span>
      <span>
        <span class="nm">${esc(p.nombre)}</span><br>
        <span class="tg" id="tg-${p.id}">—</span>
      </span>
      <button class="cp" data-id="${p.id}" title="Copiar link" aria-label="Copiar link de ${esc(p.nombre)}">⧉</button>
    </a>
  `).join("");

  $("grid").addEventListener("click", e=>{
    const cp = e.target.closest(".cp");
    if(!cp) return;
    e.preventDefault(); e.stopPropagation();
    const a = $("a-"+cp.dataset.id);
    copiar(a.href).then(()=>toast("Link copiado"));
  });
}

function copiar(texto){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(texto);
  // Respaldo para iframes sin permiso de portapapeles.
  return new Promise(res=>{
    const ta = document.createElement("textarea");
    ta.value = texto; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta); res();
  });
}

/* ---------- Recalcular todo al escribir ---------- */
function actualizar(){
  const c = $("ciudad").value.trim();
  const p = $("puesto").value.trim();

  PORTALES.forEach(portal=>{
    const url = portal.url(p, c);
    const a = $("a-"+portal.id);
    a.href = url;
    $("tg-"+portal.id).textContent = [p||null, c||null].filter(Boolean).join(" · ") || "Todas las vacantes";
  });

  // Marca visual de los chips activos
  document.querySelectorAll("#chipsCiudad .chip").forEach(b=>
    b.setAttribute("aria-pressed", String(b.dataset.v === c)));
  document.querySelectorAll("#chipsPuesto .chip").forEach(b=>
    b.setAttribute("aria-pressed", String(b.dataset.v === p)));

  $("resumen").textContent = (!c && !p)
    ? "Sin filtros: verás todas las vacantes"
    : `${PORTALES.length} portales listos`;

  store.set("bv_ciudad", c);
  store.set("bv_puesto", p);
}

/* ---------- Abrir / copiar todos ---------- */
function abrirTodos(){
  let bloqueados = 0;
  PORTALES.forEach(p=>{
    const w = window.open($("a-"+p.id).href, "_blank", "noopener");
    if(!w) bloqueados++;
  });
  toast(bloqueados
    ? "El navegador bloqueó las ventanas: permite las ventanas emergentes"
    : `Abriendo ${PORTALES.length} portales`);
}

function copiarTodos(){
  const c = $("ciudad").value.trim(), p = $("puesto").value.trim();
  const txt = `Búsqueda: ${[p,c].filter(Boolean).join(" · ") || "sin filtros"}\n\n`
    + PORTALES.map(x=>`${x.nombre}: ${$("a-"+x.id).href}`).join("\n");
  copiar(txt).then(()=>toast("Links copiados"));
}

/* =========================================================================
   SEGUIMIENTO DE POSTULACIONES
   ========================================================================= */
const COLS = ["fecha","empresa","puesto","ciudad","link","estatus","notas"];
let filas = [];

function cargarFilas(){
  try{ filas = JSON.parse(store.get("bv_filas") || "[]"); }catch(e){ filas = []; }
  if(!Array.isArray(filas)) filas = [];
}
const guardarFilas = () => store.set("bv_filas", JSON.stringify(filas));

function pintarFilas(){
  const tb = $("tbody");
  tb.innerHTML = filas.map((f,i)=>`
    <tr data-i="${i}">
      <td><input type="date"  data-k="fecha"   value="${esc(f.fecha||"")}"></td>
      <td><input type="text"  data-k="empresa" value="${esc(f.empresa||"")}" placeholder="Empresa"></td>
      <td><input type="text"  data-k="puesto"  value="${esc(f.puesto||"")}"  placeholder="Puesto"></td>
      <td><input type="text"  data-k="ciudad"  value="${esc(f.ciudad||"")}"  placeholder="Ciudad"></td>
      <td><input type="url"   data-k="link"    value="${esc(f.link||"")}"    placeholder="https://..."></td>
      <td>
        <select data-k="estatus">
          ${ESTATUS.map(s=>`<option ${s===f.estatus?"selected":""}>${esc(s)}</option>`).join("")}
        </select>
      </td>
      <td><input type="text"  data-k="notas"   value="${esc(f.notas||"")}"   placeholder="Notas"></td>
      <td><button class="del" title="Eliminar" aria-label="Eliminar fila">🗑</button></td>
    </tr>`).join("");

  $("vacio").style.display = filas.length ? "none" : "block";
  $("cnt").textContent = filas.length;
}

function agregarFila(){
  filas.unshift({
    fecha: new Date().toISOString().slice(0,10),
    empresa:"",
    puesto: $("puesto").value.trim(),
    ciudad: $("ciudad").value.trim(),
    link:"", estatus:"No aplicado", notas:""
  });
  guardarFilas(); pintarFilas();
  $("detTrack").open = true;
  const primero = $("tbody").querySelector('input[data-k="empresa"]');
  if(primero) primero.focus();
}

function descargarCsv(){
  if(!filas.length){ toast("No hay vacantes registradas"); return; }
  const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const csv = "﻿"
    + ["Fecha","Empresa","Puesto","Ciudad","Link","Estatus","Notas"].join(",") + "\n"
    + filas.map(f => COLS.map(k=>q(f[k])).join(",")).join("\n");

  const url = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8;"}));
  const a = document.createElement("a");
  a.href = url;
  a.download = `postulaciones_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* =========================================================================
   ARRANQUE
   ========================================================================= */
pintarSugerencias();
pintarPortales();
cargarFilas();
pintarFilas();

$("ciudad").value = store.get("bv_ciudad") || "";
$("puesto").value = store.get("bv_puesto") || "";
actualizar();

$("ciudad").addEventListener("input", actualizar);
$("puesto").addEventListener("input", actualizar);
$("clrCiudad").addEventListener("click", ()=>{ $("ciudad").value=""; actualizar(); $("ciudad").focus(); });
$("clrPuesto").addEventListener("click", ()=>{ $("puesto").value=""; actualizar(); $("puesto").focus(); });

$("btnTodos").addEventListener("click", abrirTodos);
$("btnCopiar").addEventListener("click", copiarTodos);
$("btnAdd").addEventListener("click", agregarFila);
$("btnCsv").addEventListener("click", descargarCsv);

/* Edición y borrado en la tabla (delegación de eventos). */
$("tbody").addEventListener("input", e=>{
  const inp = e.target.closest("[data-k]");
  if(!inp) return;
  filas[+inp.closest("tr").dataset.i][inp.dataset.k] = inp.value;
  guardarFilas();
});
$("tbody").addEventListener("change", e=>{
  const sel = e.target.closest("select[data-k]");
  if(!sel) return;
  filas[+sel.closest("tr").dataset.i][sel.dataset.k] = sel.value;
  guardarFilas();
});
$("tbody").addEventListener("click", e=>{
  if(!e.target.closest(".del")) return;
  filas.splice(+e.target.closest("tr").dataset.i, 1);
  guardarFilas(); pintarFilas();
});
</script>
</body>
</html>
